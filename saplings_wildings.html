<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mangrove Monitor - Regeneration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div id="sidebar"></div>
    <div class="page-workspace">
      <div class="mobile-toggle-header">
        <h5 class="m-0 fw-bold">
          <i class="fa-solid fa-leaf me-2"></i>Regeneration
        </h5>
        <button class="btn btn-sm btn-success" onclick="toggleMobileSidebar()">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

      <div class="p-4">
        <div
          class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"
        >
          <h2 class="m-0 fw-bold text-primary">
            <i class="fa-solid fa-seedling me-2 text-dark"></i>Regeneration
            Inventory Matrix
          </h2>
          <button
            class="btn btn-primary fw-bold px-4 shadow-sm"
            data-bs-toggle="modal"
            data-bs-target="#regenerationModal"
            id="openRegenModalBtn"
          >
            <i class="fa-solid fa-plus-circle me-1"></i>Log Stock Entry
          </button>
        </div>

        <div class="row g-4">
          <div class="col-xl-6">
            <div class="table-container">
              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <h5 class="m-0 fw-bold text-dark">
                  <i class="fa-solid fa-baby-carriage text-info me-2"></i
                  >Saplings Inventory
                </h5>
                <span class="badge bg-secondary px-2 py-1" id="saplingCounter"
                  >Total Rows: 0</span
                >
              </div>
              <div class="table-responsive">
                <table class="table align-middle border m-0">
                  <thead class="table-light text-uppercase small">
                    <tr>
                      <th>Species Name</th>
                      <th>Type</th>
                      <th>Count</th>
                      <th>
                        BA <span class="text-muted font-monospace">(cm²)</span>
                      </th>
                      <th class="text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody id="saplingTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="col-xl-6">
            <div class="table-container">
              <div
                class="d-flex justify-content-between align-items-center mb-3"
              >
                <h5 class="m-0 fw-bold text-dark">
                  <i class="fa-solid fa-shuttle-space text-warning me-2"></i
                  >Wildings Inventory
                </h5>
                <span class="badge bg-secondary px-2 py-1" id="wildingCounter"
                  >Total Rows: 0</span
                >
              </div>
              <div class="table-responsive">
                <table class="table align-middle border m-0">
                  <thead class="table-light text-uppercase small">
                    <tr>
                      <th>Species Name</th>
                      <th>Type</th>
                      <th>Count</th>
                      <th>
                        BA <span class="text-muted font-monospace">(cm²)</span>
                      </th>
                      <th class="text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody id="wildingTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="regenerationModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-dark text-white">
            <h5 class="modal-title fw-bold">
              <i class="fa-solid fa-seedling text-warning me-2"></i>Log
              Regeneration Stock
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-4">
            <form id="regenForm">
              <div class="row g-3 mb-3">
                <div class="col-6">
                  <label for="transectNumber" class="form-label fw-bold"
                    >Transect Number</label
                  >
                  <input
                    type="number"
                    min="1"
                    step="1"
                    class="form-control"
                    id="transectNumber"
                    placeholder="e.g. 1"
                    required
                  />
                </div>
                <div class="col-6">
                  <label for="plotNumber" class="form-label fw-bold"
                    >Plot Number</label
                  >
                  <input
                    type="number"
                    min="1"
                    step="1"
                    class="form-control"
                    id="plotNumber"
                    placeholder="e.g. 1"
                    required
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="speciesName" class="form-label fw-bold"
                  >Mangrove Species</label
                >
                <select class="form-select" id="speciesName" required>
                  <option value="" disabled selected hidden>
                    Select species...
                  </option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold d-block"
                  >Regeneration Type</label
                >
                <div class="form-check form-check-inline me-4">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="regenType"
                    id="typeSapling"
                    value="Sapling"
                    checked
                    required
                  />
                  <label class="form-check-label fw-semibold" for="typeSapling"
                    >Sapling</label
                  >
                </div>
                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="regenType"
                    id="typeWilding"
                    value="Wilding"
                    required
                  />
                  <label class="form-check-label fw-semibold" for="typeWilding"
                    >Wilding</label
                  >
                </div>
              </div>
              <div class="mb-4">
                <label for="totalCount" class="form-label fw-bold"
                  >Total Count</label
                >
                <input
                  type="number"
                  min="1"
                  step="1"
                  class="form-control"
                  id="totalCount"
                  placeholder="e.g. 24"
                  required
                />
              </div>
              <div class="bg-light p-3 rounded mb-4 border">
                <div class="d-flex justify-content-between align-items-center">
                  <span class="small text-secondary"
                    >Calculated Scaled BA:</span
                  >
                  <span
                    class="fw-bold text-success fs-5 font-monospace"
                    id="previewBa"
                    >—</span
                  >
                </div>
              </div>
              <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                <i class="fa-solid fa-circle-check me-1"></i>Commit Entry
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const regenForm = document.getElementById("regenForm");
        const totalCountInput = document.getElementById("totalCount");
        const previewBa = document.getElementById("previewBa");
        populateSpeciesDropdown("speciesName");

        document
          .getElementById("openRegenModalBtn")
          .addEventListener("click", () => {
            regenForm.reset();
            previewBa.textContent = "—";
          });

        // FIXED: Combined loop extracts the active categorization to update previews correctly
        function updateLivePreview() {
          const countVal = parseInt(totalCountInput.value);
          const activeRadio = document.querySelector(
            'input[name="regenType"]:checked',
          );

          if (!isNaN(countVal) && countVal > 0 && activeRadio) {
            const computedBa = calculateRegenBasalArea(
              countVal,
              activeRadio.value,
            );
            previewBa.textContent = `${computedBa} cm²`;
          } else {
            previewBa.textContent = "—";
          }
        }

        totalCountInput.addEventListener("input", updateLivePreview);
        document
          .querySelectorAll('input[name="regenType"]')
          .forEach((radio) => {
            radio.addEventListener("change", updateLivePreview);
          });

        // Form submission database router pipeline with duplicate validation guard rules
        regenForm.addEventListener("submit", async function (e) {
          e.preventDefault();

          const species = document.getElementById("speciesName").value;
          const transectNum = parseInt(
            document.getElementById("transectNumber").value,
          );
          const plotNum = parseInt(document.getElementById("plotNumber").value);
          const count = parseInt(totalCountInput.value);
          const typeValue = document.querySelector(
            'input[name="regenType"]:checked',
          ).value;

          // FIXED: Now accurately passes the selection type parameter to evaluate separate formula paths
          const calculatedBa = calculateRegenBasalArea(count, typeValue);

          const combinedRecordsList = [...saplingRecords, ...wildingRecords];
          const duplicateExists = combinedRecordsList.some(
            (r) =>
              parseInt(r.transect) === transectNum &&
              parseInt(r.plot) === plotNum &&
              r.type === typeValue &&
              r.species === species,
          );

          if (duplicateExists) {
            console.warn(
              `LOG BLOCKER: Terminating write. Duplicate entry found for Transect ${transectNum}, Plot ${plotNum}, Category: ${typeValue}, Species: ${species}`,
            );

            Swal.fire({
              title: "Duplicate Detected",
              text: `A record for Transect ${transectNum}, Plot ${plotNum} (${typeValue} - ${species.split(" ")[0]}) already exists inside the cloud database register ledger.`,
              icon: "warning",
              confirmButtonColor: "#3085d6",
            });
            return;
          }

          Swal.fire({
            title: "Logging Stock...",
            allowOutsideClick: false,
            didOpen: () => {
              Swal.showLoading();
            },
          });

          try {
            const { error } = await _supabase
              .from("mangrove_regeneration")
              .insert([
                {
                  species: species,
                  type: typeValue,
                  transect_number: transectNum,
                  plot_number: plotNum,
                  total_count: count,
                  basal_area: parseFloat(calculatedBa),
                },
              ]);

            if (error) throw error;

            bootstrap.Modal.getInstance(
              document.getElementById("regenerationModal"),
            ).hide();
            await fetchRegenCloudRecords();

            Swal.fire({
              title: "Stock Record Logged!",
              text: `Transect ${transectNum} Plot ${plotNum} saved cleanly.`,
              icon: "success",
              confirmButtonColor: "#198754",
            });
          } catch (err) {
            Swal.fire({
              title: "Database Error",
              text: err.message,
              icon: "error",
            });
          }
        });
      });

      async function deleteRegenEntry(id) {
        const res = await Swal.fire({
          title: "Delete Record?",
          text: "This deletes the row completely.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#dc3545",
        });
        if (res.isConfirmed) {
          await _supabase.from("mangrove_regeneration").delete().eq("id", id);
          await fetchRegenCloudRecords();
        }
      }

      fetchRegenCloudRecords();
    </script>
  </body>
</html>
