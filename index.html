<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecology Portal - Sign In</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f8fafc;
      }
      .login-container {
        width: 100%;
        max-width: 420px;
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 40px 32px;
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.3),
          0 10px 10px -5px rgba(0, 0, 0, 0.2);
      }
      /* FIXED: Reconstructed form elements wrapper layers for uniform dark layout flow */
      .input-group {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        overflow: hidden;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .input-group:focus-within {
        border-color: #198754;
        box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
      }
      .input-group-text {
        background: transparent !important;
        border: none !important;
        color: #64748b !important;
        padding-left: 16px;
        padding-right: 16px;
      }
      .form-control {
        background: transparent !important;
        border: none !important;
        color: #f8fafc !important;
        padding: 12px 16px 12px 8px;
        box-shadow: none !important;
      }
      /* Interactive password toggler text box modifications */
      .password-toggle-btn {
        background: transparent;
        border: none;
        color: #64748b;
        padding-right: 16px;
        padding-left: 16px;
        transition: color 0.2s ease;
      }
      .password-toggle-btn:hover {
        color: #f8fafc;
      }
      .btn-auth {
        background-color: #198754;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .btn-auth:hover {
        background-color: #157347;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="text-center mb-4">
        <div class="display-5 text-success mb-2">
          <i class="fa-solid fa-seedling text-warning"></i>
        </div>
        <h4 class="fw-bold m-0">Mangrove Monitor</h4>
        <small class="text-muted text-uppercase tracking-wider"
          >Ecological Research Portal</small
        >
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label
            for="loginIdentifier"
            class="form-label small fw-bold text-secondary"
            >Username or Email Address</label
          >
          <div class="input-group">
            <span class="input-group-text" id="inputIcon"
              ><i class="fa-solid fa-user"></i
            ></span>
            <input
              type="text"
              class="form-control"
              id="loginIdentifier"
              placeholder="Username or email..."
              required
            />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small fw-bold text-secondary"
            >Password</label
          >
          <div class="input-group">
            <span class="input-group-text"
              ><i class="fa-solid fa-lock"></i
            ></span>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="••••••••"
              required
            />
            <button
              type="button"
              class="password-toggle-btn"
              id="passwordToggle"
              title="Toggle password visibility"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-success btn-auth w-100 mb-3">
          <i class="fa-solid fa-right-to-bracket me-2"></i>Login
        </button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SUPABASE_URL = "https://tqgswktjbtqjunzmhuth.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxZ3N3a3RqYnRxanVuem1odXRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTk3NTgsImV4cCI6MjA5NTE5NTc1OH0.Za4hXbo4cEUthkw41Q6zcCsAG8x1LEvYmQkLmSH3Z8M";
      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const loginInput = document.getElementById("loginIdentifier");
      const iconContainer = document.getElementById("inputIcon");
      const passwordInput = document.getElementById("password");
      const passwordToggle = document.getElementById("passwordToggle");

      // Dynamic input icon handler shifts icon visually as user types
      loginInput.addEventListener("input", function () {
        if (this.value.includes("@")) {
          iconContainer.innerHTML = '<i class="fa-solid fa-envelope"></i>';
        } else {
          iconContainer.innerHTML = '<i class="fa-solid fa-user"></i>';
        }
      });

      // FIXED: Dynamic password view state toggler loop
      passwordToggle.addEventListener("click", function () {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          this.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
        } else {
          passwordInput.type = "password";
          this.innerHTML = '<i class="fa-solid fa-eye"></i>';
        }
      });

      // Client-Side helper function to calculate SHA-256 values inside browser contexts
      async function sha256(string) {
        const utf8 = new TextEncoder().encode(string);
        const hashBuffer = await crypto.subtle.digest("SHA-256", utf8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          Swal.fire({
            title: "Verifying Credentials...",
            allowOutsideClick: false,
            didOpen: () => {
              Swal.showLoading();
            },
          });

          const userInput = loginInput.value.trim().toLowerCase();
          const rawPassword = passwordInput.value;

          try {
            const generatedHash = await sha256(rawPassword);

            const { data: userMatch, error } = await _supabase
              .from("users")
              .select("*")
              .eq("username", userInput)
              .single();

            if (error || !userMatch) {
              throw new Error(
                "No active registry profile matches that username.",
              );
            }

            if (userMatch.password_hash !== generatedHash) {
              throw new Error(
                "Invalid password signature validation code matches.",
              );
            }

            localStorage.setItem("portal_session_active", "true");
            localStorage.setItem("portal_user", userMatch.username);

            Swal.fire({
              title: "Access Granted",
              text: "Redirecting to your ecological plot workspace ledger...",
              icon: "success",
              timer: 1500,
              showConfirmButton: false,
            });

            setTimeout(() => {
              window.location.href = "tree.html";
            }, 1200);
          } catch (err) {
            console.error("AUTH EXCEPTION: Request rejected:", err.message);
            Swal.fire({
              title: "Authentication Failed",
              text: "Invalid user credentials or unmatched table data row parameters.",
              icon: "error",
              confirmButtonColor: "#198754",
            });
          }
        });
    </script>
  </body>
</html>
